<!DOCTYPE html>
<html lang="fa" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Privacy Auto-Anonymizer</title>
    <!-- Google Fonts: Vazirmatn & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Vazirmatn', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                    },
                    colors: {
                        surface: {
                            DEFAULT: '#09090b',
                            elevated: '#121215',
                            card: '#18181b',
                            border: '#27272a',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #09090b;
            color: #fafafa;
        }
        /* Custom delicate scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #09090b;
        }
        ::-webkit-scrollbar-thumb {
            background: #27272a;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3f3f46;
        }
        .canvas-grid {
            background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans bg-[#09090b] text-zinc-100 selection:bg-zinc-800 selection:text-white antialiased">

    <!-- Minimalist Engineering Header -->
    <header class="border-b border-zinc-800/60 bg-[#09090b]/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-5 sm:px-8 h-14 flex items-center justify-between">
            <!-- Brand Info -->
            <div class="flex items-center gap-3">
                <div class="w-7 h-7 rounded-lg bg-zinc-900 border border-zinc-800 flex items-center justify-center text-zinc-200">
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                        <path d="M9 12l2 2 4-4"/>
                    </svg>
                </div>
                <div class="flex items-baseline gap-2">
                    <span class="text-sm font-semibold tracking-tight text-zinc-100 font-mono">Privacy Auto-Anonymizer</span>
                    <span class="hidden sm:inline text-xs text-zinc-500 font-normal">| سامانه هوشمند پالایش داده‌های حساس</span>
                </div>
            </div>

            <!-- Upload Action Button -->
            <div class="flex items-center">
                <label for="imageUploadInput" class="cursor-pointer inline-flex items-center gap-2 px-3.5 py-1.5 rounded-lg bg-zinc-100 hover:bg-white text-zinc-950 text-xs font-medium transition-all duration-200 shadow-sm active:scale-[0.98]">
                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="17 8 12 3 7 8"/>
                        <line x1="12" y1="3" x2="12" y2="15"/>
                    </svg>
                    <span>بارگذاری تصویر</span>
                </label>
                <input type="file" id="imageUploadInput" accept="image/*" class="hidden">
            </div>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 max-w-6xl w-full mx-auto p-4 sm:p-6 lg:p-8 flex flex-col gap-5">
        
        <!-- Central Canvas / Dropzone Area -->
        <div id="dropzoneContainer" class="flex-1 bg-[#0c0c0e] border border-dashed border-zinc-800/80 hover:border-zinc-700 rounded-xl relative flex flex-col items-center justify-center min-h-[500px] overflow-hidden transition-all duration-300 group canvas-grid">
            
            <!-- Empty State / Dropzone -->
            <div id="placeholderState" class="flex flex-col items-center justify-center text-center p-8 z-10 select-none">
                <div class="w-14 h-14 rounded-xl bg-zinc-900/90 border border-zinc-800/80 flex items-center justify-center text-zinc-400 mb-4 group-hover:border-zinc-700 group-hover:text-zinc-200 transition-colors duration-300">
                    <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                        <circle cx="8.5" cy="8.5" r="1.5"/>
                        <polyline points="21 15 16 10 5 21"/>
                    </svg>
                </div>
                <h3 class="text-sm font-medium text-zinc-200 mb-1">تصویر را اینجا رها کنید</h3>
                <p class="text-xs text-zinc-500 max-w-xs mb-5 leading-relaxed">پشتیبانی از فرمت‌های PNG ،JPG و WEBP جهت ردیابی و محو خودکار چهره، پلاک و متون</p>
                <label for="imageUploadInput" class="cursor-pointer inline-flex items-center gap-2 px-4 py-2 rounded-lg bg-zinc-900 hover:bg-zinc-800 text-zinc-300 hover:text-white text-xs font-medium border border-zinc-800/90 transition-all duration-200">
                    <span>انتخاب فایل</span>
                </label>
            </div>

            <!-- HTML5 Canvas Preview Element -->
            <canvas id="imageCanvas" class="hidden max-w-full max-h-[72vh] rounded-lg shadow-2xl z-10 object-contain"></canvas>
        </div>

        <!-- Bottom Operational Controls -->
        <footer class="bg-[#0c0c0e] border border-zinc-800/80 rounded-xl px-4 py-3 flex flex-wrap items-center justify-between gap-3">
            
            <!-- Selection Toggles -->
            <div class="flex items-center gap-2">
                <button type="button" id="btnSelectAll" disabled class="disabled:opacity-30 disabled:cursor-not-allowed inline-flex items-center gap-2 px-3.5 py-1.5 rounded-lg bg-zinc-900 border border-zinc-800 text-zinc-300 hover:bg-zinc-800 hover:text-white text-xs font-medium transition-all duration-200">
                    <svg class="w-3.5 h-3.5 text-zinc-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12"/>
                    </svg>
                    <span>انتخاب همه</span>
                </button>

                <button type="button" id="btnDeselectAll" disabled class="disabled:opacity-30 disabled:cursor-not-allowed inline-flex items-center gap-2 px-3.5 py-1.5 rounded-lg bg-zinc-900 border border-zinc-800 text-zinc-300 hover:bg-zinc-800 hover:text-white text-xs font-medium transition-all duration-200">
                    <svg class="w-3.5 h-3.5 text-zinc-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                    <span>لغو همه</span>
                </button>
            </div>

            <!-- Export / Download Action -->
            <div>
                <button type="button" id="btnExport" disabled class="disabled:opacity-30 disabled:cursor-not-allowed inline-flex items-center gap-2 px-4 py-1.5 rounded-lg bg-zinc-100 hover:bg-white text-zinc-950 text-xs font-semibold transition-all duration-200 shadow-sm active:scale-[0.98]">
                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                    <span>استخراج تصویر نهایی</span>
                </button>
            </div>
        </footer>

    </main>

    <!-- Client-side Logic (Canvas initialization & Drag and Drop) -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const uploadInput = document.getElementById('imageUploadInput');
            const dropzone = document.getElementById('dropzoneContainer');
            const placeholder = document.getElementById('placeholderState');
            const canvas = document.getElementById('imageCanvas');
            const ctx = canvas.getContext('2d');

            function handleFile(file) {
                if (!file || !file.type.startsWith('image/')) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        canvas.width = img.width;
                        canvas.height = img.height;
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        ctx.drawImage(img, 0, 0);
                        
                        placeholder.classList.add('hidden');
                        canvas.classList.remove('hidden');
                        dropzone.classList.remove('border-dashed');
                        dropzone.classList.add('border-solid');
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }

            uploadInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                handleFile(file);
            });

            // Drag and Drop support
            ['dragenter', 'dragover'].forEach(eventName => {
                dropzone.addEventListener(eventName, (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    dropzone.classList.add('border-zinc-500', 'bg-zinc-900/30');
                });
            });

            ['dragleave', 'drop'].forEach(eventName => {
                dropzone.addEventListener(eventName, (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    dropzone.classList.remove('border-zinc-500', 'bg-zinc-900/30');
                });
            });

            dropzone.addEventListener('drop', (e) => {
                const dt = e.dataTransfer;
                const file = dt.files[0];
                handleFile(file);
            });
        });
    </script>
</body>
</html>
